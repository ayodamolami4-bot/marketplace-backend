spring.application.name=marketplace-backend

spring.datasource.url=jdbc:postgresql://localhost:5432/marketplace
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.baseline-description=Existing Marketplace schema

app.jwt.secret=${JWT_SECRET}

cloudinary.enabled=false
cloudinary.url=${CLOUDINARY_URL:}

paystack.base-url=https://api.paystack.co
paystack.secret-key=${PAYSTACK_SECRET_KEY:}
paystack.callback-url=${PAYSTACK_CALLBACK_URL:}

payment.reconciliation.enabled=true
payment.reconciliation.fixed-delay-ms=60000
payment.reconciliation.initial-delay-ms=30000
payment.reconciliation.batch-size=100

checkout.idempotency.recovery-enabled=true
checkout.idempotency.recovery-fixed-delay-ms=60000
checkout.idempotency.recovery-initial-delay-ms=60000
checkout.idempotency.recovery-age-ms=300000
checkout.idempotency.recovery-batch-size=100

payment.expiry.enabled=true
payment.expiry.age-ms=1800000
payment.expiry.fixed-delay-ms=60000
payment.expiry.initial-delay-ms=60000
payment.expiry.batch-size=100

payment.initialization-recovery.enabled=true
payment.initialization-recovery.age-ms=120000
payment.initialization-recovery.fixed-delay-ms=60000
payment.initialization-recovery.initial-delay-ms=60000
payment.initialization-recovery.batch-size=100

database.lock-retry.max-attempts=3
database.lock-retry.initial-backoff-ms=50
database.lock-retry.max-backoff-ms=250

spring.datasource.hikari.connection-init-sql=SET lock_timeout TO '5s'

# Prevent accidental database access while serializing HTTP responses.
spring.jpa.open-in-view=false

# Development frontend.
# Production can override this with APP_CORS_ALLOWED_ORIGINS.
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Do not expose framework error details to API clients.
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never
server.error.include-exception=false

security.auth-rate-limit.max-requests=10
security.auth-rate-limit.window-ms=60000

# Observability
management.endpoints.web.exposure.include=health,info,metrics,scheduledtasks
management.endpoint.health.show-details=never

# Liveness/readiness
management.endpoint.health.probes.enabled=true
management.endpoint.health.probes.add-additional-paths=true

# Database affects readiness, but not liveness.
management.endpoint.health.group.readiness.include=readinessState,db

# Application identity on metrics.
management.metrics.tags.application=${spring.application.name:marketplace-backend}

info.app.name=Marketplace Backend
info.app.description=Multi-vendor marketplace backend