paystack.demo-mode=true
paystack.base-url=https://api.paystack.co
paystack.secret-key=${PAYSTACK_SECRET_KEY:demo-only-secret}
paystack.callback-url=${PAYSTACK_CALLBACK_URL:http://localhost:5173/payment/callback}
paystack.demo-authorization-base-url=${PAYSTACK_DEMO_AUTHORIZATION_BASE_URL:http://localhost:5173/payment/demo}

payment.reconciliation.enabled=true

payment.initialization-recovery.enabled=true
payment.initialization-recovery.age-ms=1000
payment.initialization-recovery.initial-delay-ms=1000
payment.initialization-recovery.fixed-delay-ms=5000

demo.seed.enabled=${DEMO_SEED_ENABLED:true}
demo.seed.admin-password=${DEMO_ADMIN_PASSWORD:}
demo.seed.user-password=${DEMO_USER_PASSWORD:}
